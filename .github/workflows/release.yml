name: Release

# Tag-driven: push a semver tag (e.g. `git tag v1.1.0 && git push origin v1.1.0`)
# to cut a release. The tag name is the source of truth for the version — this
# fork does not publish to npm, so there is no need to synthesize a unique
# version per run (the previous `run_number` scheme could regress below a
# manually created tag and collide with upstream's `v1.0.x` tags).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "bun install failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Run tests
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Verify extension compiles
        run: bun build index.ts --no-bundle --outfile /tmp/pi-gh-cli-build.js

      - name: Check tag against package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::warning::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}. The tag is used as the release version; keep package.json in sync when you bump it."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME} (commit ${GITHUB_SHA})" \
            --latest
