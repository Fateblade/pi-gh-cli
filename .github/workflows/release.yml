name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "bun install failed; retrying in 5 seconds..."
            sleep 5
          done

      - name: Run tests
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Verify extension compiles
        run: bun build index.ts --no-bundle --outfile /tmp/pi-gh-cli-build.js

      - name: Compute version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          MAJOR=$(echo "${BASE}" | cut -d. -f1)
          MINOR=$(echo "${BASE}" | cut -d. -f2)
          VERSION="${MAJOR}.${MINOR}.${{ github.run_number }}"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target main \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "Auto-release from commit ${{ github.sha }}" \
            --latest
